name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.3.4 (must not exist yet)"
        required: true
        type: string
      draft:
        description: "Create as a draft so you can test the files before publishing"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false

jobs:
  release-checks:
    name: Check permission and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER may create releases (run by $ACTOR)."
            exit 1
          fi
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::Releases can only be created from master (selected: $REF)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or v1.2.3-beta.1 (got: $VERSION)"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::A release named $VERSION already exists."
            exit 1
          fi

  ci:
    name: CI
    needs: release-checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit # Send Secrets

  build-windows:
    name: Build Windows (${{ matrix.mode }})
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        mode: [exe, folder]
    env:
      VERSION: ${{ inputs.version }}
      DAILYPLATE_BUILD_MODE: ${{ matrix.mode }}   # read by release/windows/DailyPlate.spec

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv

      - name: Install project and PyInstaller
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e .
          .venv\Scripts\python.exe -m pip install "pyinstaller>=6.10"
          .venv\Scripts\python.exe -m PyInstaller --version

      - name: Build
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m PyInstaller release\windows\DailyPlate.spec --noconfirm --clean `
            --distpath release\windows\dist --workpath release\windows\build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          if ($env:DAILYPLATE_BUILD_MODE -eq "folder") {
            Compress-Archive -Path release\windows\dist\DailyPlate `
              -DestinationPath "out\DailyPlate-$env:VERSION-windows-x64-folder.zip"
          } else {
            Copy-Item release\windows\dist\DailyPlate.exe "out\DailyPlate-$env:VERSION-windows-x64.exe"
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.mode }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: ci
    # Oldest runner image on purpose: the app runs on this glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Build
        run: bash release/linux/build_linux.sh --skip-tests   # tests already ran in the CI job

      - name: Smoke test
        run: |
          # Unzip like a user would, start the app headless, and expect it to still be running
          # when the timeout kills it (exit code 124). Any other exit code means it crashed.
          tmp="$(mktemp -d)"
          unzip -q release/linux/dist/DailyPlate-linux-*.zip -d "$tmp"
          code=0
          QT_QPA_PLATFORM=offscreen XDG_DATA_HOME="$tmp/xdg" \
            timeout 15 "$tmp/DailyPlate/DailyPlate" || code=$?
          if [ "$code" -ne 124 ]; then
            echo "::error::The app exited early with code $code."
            exit 1
          fi

      - name: Package
        run: |
          mkdir out
          cp release/linux/dist/DailyPlate-linux-x64.zip "out/DailyPlate-${VERSION}-linux-x64.zip"
          ls -l out

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish to GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          Windows and Linux 64-bit builds of Daily Plate. No Python install needed.

          **Windows**

          - **`...-windows-x64.exe`** - single file; double-click to run. Slightly slower start.
          - **`...-windows-x64-folder.zip`** - unzip and run `DailyPlate\DailyPlate.exe`; starts faster. Keep the `_internal` folder next to the exe.

          Your data is stored in `%LOCALAPPDATA%\DailyPlate\data` (or in a `data` folder next to the exe, if you create one).

          **Linux**

          - **`...-linux-x64.zip`** - unzip and run `DailyPlate/DailyPlate`. Keep the `_internal` folder next to it. Needs a 64-bit distribution with glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+). If the app does not start and mentions the Qt "xcb" plugin, install `libxcb-cursor0` (Debian/Ubuntu) or `xcb-util-cursor` (Fedora). If the file is not executable after unzipping, run `chmod +x DailyPlate/DailyPlate`.

          Your data is stored in `~/.local/share/DailyPlate/data` (or `$XDG_DATA_HOME/DailyPlate/data`, or in a `data` folder next to the executable, if you create one).

          The Windows builds are not code-signed, so Windows SmartScreen may show "Unknown publisher" - choose *More info -> Run anyway*.
          Verify downloads against `SHA256SUMS.txt`.
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$VERSION" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Daily Plate $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"